name: Temporary CodeQL cleanup verifier for #219

on:
  push:
    branches:
      - agent/unify-policy-rule-chain-219

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[agent-cleanup-219]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/unify-policy-rule-chain-219
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Remove dead compatibility aliases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/weaver_kernel/policy.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''from .default_policy_rules import (\n    MAX_ROWS_SERVICE,\n    MAX_ROWS_USER,\n    MIN_JUSTIFICATION,\n    DefaultPolicyRuleChain,\n)\n'''
          new_import = 'from .default_policy_rules import DefaultPolicyRuleChain\n'
          if text.count(old_import) != 1:
              raise SystemExit(f"unexpected default_policy_rules import count: {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)
          dead = '''# Minimum justification length for WRITE operations.\n_MIN_JUSTIFICATION = MIN_JUSTIFICATION\n\n# Default max_rows caps.\n_MAX_ROWS_USER = MAX_ROWS_USER\n_MAX_ROWS_SERVICE = MAX_ROWS_SERVICE\n\n'''
          if text.count(dead) != 1:
              raise SystemExit(f"unexpected dead-alias block count: {text.count(dead)}")
          path.write_text(text.replace(dead, "", 1), encoding="utf-8")

          path = Path("src/weaver_kernel/coding_agent.py")
          text = path.read_text(encoding="utf-8")
          old = 'from .policy import _MIN_JUSTIFICATION\n'
          new = 'from .default_policy_rule_types import MIN_JUSTIFICATION\n'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected coding_agent import count: {text.count(old)}")
          text = text.replace(old, new, 1)
          count = text.count("_MIN_JUSTIFICATION")
          if count == 0:
              raise SystemExit("expected coding_agent to use _MIN_JUSTIFICATION")
          text = text.replace("_MIN_JUSTIFICATION", "MIN_JUSTIFICATION")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run authoritative repository gate
        run: make ci
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/weaver_kernel/policy.py src/weaver_kernel/coding_agent.py
          if ! git diff --cached --quiet; then
            git commit -m "[agent-cleanup-219] Remove unused policy aliases"
            git push origin HEAD:agent/unify-policy-rule-chain-219
          fi
