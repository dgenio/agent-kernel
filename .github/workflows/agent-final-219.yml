name: Temporary final architecture verification for #219

on:
  push:
    branches:
      - agent/unify-policy-rule-chain-219

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[agent-final-219]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/unify-policy-rule-chain-219
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Update canonical agent guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")
          old = """## Adding a policy rule\n\n1. Add the rule to `DefaultPolicyEngine.evaluate()` in `policy.py`.\n2. **Placement matters:** rules are evaluated in order. A new rule placed before sensitivity checks silently bypasses them.\n3. If adding a new `SensitivityTag`, you must also add a corresponding policy rule — otherwise the tag is silently ignored.\n4. Cover it with a test in `tests/test_policy.py`.\n"""
          new = """## Adding a policy rule\n\n1. Implement the condition in the appropriate `default_policy_*_rules.py` helper.\n2. Register it exactly once in the ordered `_DEFAULT_RULES` tuple in `default_policy_rules.py`; both `evaluate()` and `explain()` consume that chain.\n3. **Placement matters:** rules are evaluated in order. A new rule placed before sensitivity checks can change which denial short-circuits first.\n4. If adding a new `SensitivityTag`, you must also add a corresponding policy rule — otherwise the tag is silently ignored.\n5. Cover decision/explanation agreement in `tests/test_policy_rule_chain.py` and behavior in `tests/test_policy.py`.\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one policy-guidance block, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize formatting
        run: python -m ruff format src/ tests/ examples/
      - name: Run authoritative repository gate
        run: make ci
      - name: Commit verified final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md src/ tests/
          if ! git diff --cached --quiet; then
            git commit -m "[agent-final-219] Validate shared policy rule chain"
            git push origin HEAD:agent/unify-policy-rule-chain-219
          fi
