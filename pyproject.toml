[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weaver-kernel"
version = "0.11.0"
description = "Capability-based security kernel for AI agents operating in large tool ecosystems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "agent-kernel contributors" }]
keywords = [
    "ai",
    "agents",
    "mcp",
    "security",
    "capabilities",
    "capability-based-security",
    "authorization",
    "audit",
    "llm",
    "weaver-stack",
    "weaver-kernel",
    "agent-kernel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.scripts]
weaver-kernel = "weaver_kernel.cli:main"

[project.urls]
Homepage = "https://github.com/dgenio/agent-kernel"
Repository = "https://github.com/dgenio/agent-kernel"
Documentation = "https://github.com/dgenio/agent-kernel/tree/main/docs"
Changelog = "https://github.com/dgenio/agent-kernel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    # MCP 2.x removes/changes APIs used by the current driver. Keep v1 as the
    # supported compatibility line until the deliberate migration in #263.
    "mcp>=1.6,<3",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "types-PyYAML>=6.0",
    "weaver-contracts>=0.7,<0.8",
]
mcp = ["mcp>=1.6,<3"]
otel = ["opentelemetry-api>=1.20"]
policy = [
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
]
tiktoken = ["tiktoken>=0.6"]
# Weaver-spec contract conformance: validate kernel objects against the
# published weaver-contracts dataclasses. Optional so `import weaver_kernel`
# never requires it; CI installs it (via [dev]) to run tests/test_conformance.py.
conformance = ["weaver-contracts>=0.7,<0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/weaver_kernel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["weaver_kernel"]

[tool.coverage.report]
# Ratchet floor: kept slightly below the measured branch coverage so the gate
# protects against regressions without forcing aspirational targets. Raise it
# (never lower it) as coverage climbs — see CONTRIBUTING.md.
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/"]

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "weaver_contracts.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tiktoken.*"
ignore_missing_imports = true
